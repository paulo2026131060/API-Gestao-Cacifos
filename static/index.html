<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido de Cacifo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f2f4f7; margin: 0; display: grid; place-items: center; min-height: 100vh; }
    form { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.1); width: min(420px, 92vw); }
    h1 { margin-top: 0; font-size: 1.4rem; }
    label { display: block; margin: 1rem 0 .3rem; font-weight: 600; }
    input, textarea { width: 100%; padding: .6rem; border: 1px solid #ccd; border-radius: 6px; font: inherit; box-sizing: border-box; }
    button { margin-top: 1.2rem; width: 100%; padding: .7rem; border: 0; border-radius: 6px; background: #2563eb; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #msg { margin-top: 1rem; text-align: center; }
    .ok { color: #15803d; } .erro { color: #b91c1c; }
  </style>
</head>
<body>
  <form id="form">
    <h1>Pedido de Cacifo</h1>
    <label for="aluno">Nome do aluno</label>
    <input id="aluno" name="aluno" maxlength="100" required>
    <label for="numero">Número do aluno</label>
    <input id="numero" name="numero" inputmode="numeric" pattern="[0-9]+" maxlength="20" required>
    <label for="material">Material que pretende</label>
    <textarea id="material" name="material" rows="4" maxlength="500" required></textarea>
    <button type="submit">Enviar pedido</button>
    <div id="msg"></div>
  </form>

  <script>
    const form = document.getElementById("form");
    const msg = document.getElementById("msg");
    const btn = form.querySelector("button");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      msg.className = ""; msg.textContent = "";
      try {
        const resp = await fetch("/api/requests", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            student: form.aluno.value,
            student_number: form.numero.value,
            material: form.material.value,
          }),
        });
        if (!resp.ok) throw new Error();
        const pedido = await resp.json();
        msg.className = "ok";
        msg.textContent = `Pedido nº ${pedido.id} enviado! Estado: ${pedido.status}.`;
        form.reset();
      } catch {
        msg.className = "erro";
        msg.textContent = "Erro ao enviar o pedido. Tente novamente.";
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
